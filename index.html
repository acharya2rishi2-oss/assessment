<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बाल सिकाइ पोर्टल (Primary Curriculum Portal)</title>
    <!-- आकर्षक गुगल फन्ट -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #bae6fd;
            --sky-mid: #e0f2fe;
            --sun-warm: #fef3c7;
            --surface: #ffffff;
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-shadow: #1e3a8a;
            --accent: #f59e0b;
            --accent-shadow: #b45309;
            --success: #15803d;
            --success-bg: #dcfce7;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border-light: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Mukta', sans-serif;
            background: radial-gradient(circle at 15% 15%, #fef08a 0%, transparent 30%),
                        radial-gradient(circle at 85% 85%, #a7f3d0 0%, transparent 30%),
                        linear-gradient(160deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sun-warm) 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .master-card {
            width: 100%;
            max-width: 820px;
            background: var(--surface);
            border-radius: 32px;
            border: 5px solid #ffffff;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25), 0 8px 0 #cbd5e1;
            overflow: hidden;
            position: relative;
            animation: cardAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardAppear {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* आकर्षक हेडर */
        header {
            background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 50%, #06b6d4 100%);
            color: #ffffff;
            padding: 28px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 5px solid #1e3a8a;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: "";
            position: absolute;
            right: -30px;
            bottom: -30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1;
        }

        .logo-badge {
            width: 60px;
            height: 60px;
            background: #fde047;
            color: #713f12;
            border: 3.5px solid #ffffff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 0 #ca8a04;
            flex-shrink: 0;
        }

        header h1 {
            font-size: clamp(1.4rem, 3vw, 1.9rem);
            font-weight: 800;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        header p {
            font-size: 0.98rem;
            opacity: 0.95;
            margin-top: 3px;
            font-weight: 600;
        }

        .code-preview-pill {
            background: rgba(15, 23, 42, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 9px 18px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            z-index: 1;
            backdrop-filter: blur(4px);
        }

        .code-preview-pill span {
            color: #fde047;
            font-family: monospace;
            font-size: 1.1rem;
        }

        /* मुख्य फर्म बडी */
        .form-body {
            padding: 32px;
        }

        .dropdown-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (max-width: 680px) {
            .dropdown-grid {
                grid-template-columns: 1fr;
            }
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-group label {
            font-weight: 800;
            font-size: 1.02rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .select-wrapper {
            position: relative;
        }

        select {
            width: 100%;
            appearance: none;
            background: #f8fafc;
            border: 3.5px solid var(--border-light);
            border-radius: 18px;
            padding: 14px 46px 14px 18px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        select:hover {
            border-color: #93c5fd;
            background: #ffffff;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .select-wrapper::after {
            content: "▼";
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            color: var(--primary);
            pointer-events: none;
        }

        /* लाइभ समरी बक्स */
        .selection-summary {
            margin-top: 24px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 3px solid #93c5fd;
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
        }

        .summary-details {
            font-size: 1.02rem;
            font-weight: 800;
            color: #1e3a8a;
        }

        .status-tag {
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .status-tag.ready {
            background: var(--success-bg);
            color: var(--success);
            border: 2.5px solid #22c55e;
            box-shadow: 0 2px 6px rgba(21, 128, 61, 0.15);
        }

        .status-tag.pending {
            background: #fef3c7;
            color: #92400e;
            border: 2.5px solid #f59e0b;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.15);
        }

        /* आकर्षक नेक्स्ट बटन */
        .action-row {
            margin-top: 28px;
        }

        .btn-next {
            width: 100%;
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 800;
            padding: 16px 30px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            box-shadow: 0 6px 0 var(--primary-shadow);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.12s, box-shadow 0.12s, filter 0.2s;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--primary-shadow);
            filter: brightness(1.05);
        }

        .btn-next:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--primary-shadow);
        }

        /* कमिंग सुन मोडल (Coming Soon Modal) */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 28px;
            border: 5px solid #fde047;
            padding: 32px 26px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-backdrop.active .modal-card {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 3.8rem;
            margin-bottom: 10px;
            animation: bounceIcon 1s infinite alternate;
        }

        @keyframes bounceIcon {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .modal-card h2 {
            font-size: 1.85rem;
            font-weight: 800;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .modal-card p {
            font-size: 1.05rem;
            color: #334155;
            line-height: 1.6;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal-file-badge {
            display: inline-block;
            background: #fef3c7;
            border: 2.5px dashed #d97706;
            color: #92400e;
            font-family: monospace;
            font-size: 1.05rem;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 12px;
            margin-bottom: 22px;
        }

        .btn-modal-next {
            width: 100%;
            font-family: inherit;
            font-size: 1.15rem;
            font-weight: 800;
            padding: 14px 24px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            box-shadow: 0 5px 0 var(--accent-shadow);
            cursor: pointer;
            transition: transform 0.12s;
        }

        .btn-modal-next:hover {
            transform: translateY(-1px);
        }

        .btn-modal-next:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--accent-shadow);
        }
    </style>
</head>
<body>

<div class="master-card">
    <header>
        <div class="header-title-group">
            <div class="logo-badge" aria-hidden="true">🎯</div>
            <div>
                <h1>बाल सिकाइ पोर्टल</h1>
                <p>कक्षा, विषय, र सिकाइ उपलब्धि छान्नुहोस्</p>
            </div>
        </div>
        <div class="code-preview-pill">
            फाइल: <span id="fileCodeBadge">1MLA1.html</span>
        </div>
    </header>

    <main class="form-body">
        <div class="dropdown-grid">
            <!-- ड्रपडाउन १: कक्षा (1-5) -->
            <div class="field-group">
                <label for="gradeSelect">१. कक्षा छान्नुहोस् (Grade)</label>
                <div class="select-wrapper">
                    <select id="gradeSelect">
                        <option value="1">कक्षा १ (Grade 1)</option>
                        <option value="2">कक्षा २ (Grade 2)</option>
                        <option value="3">कक्षा ३ (Grade 3)</option>
                        <option value="4">कक्षा ४ (Grade 4)</option>
                        <option value="5">कक्षा ५ (Grade 5)</option>
                    </select>
                </div>
            </div>

            <!-- ड्रपडाउन २: विषय -->
            <div class="field-group">
                <label for="subjectSelect">२. विषय छान्नुहोस् (Subject)</label>
                <div class="select-wrapper">
                    <select id="subjectSelect">
                        <option value="M">गणित (Mathematics)</option>
                        <option value="S">मेरो सेरोफेरो (Serophero)</option>
                        <option value="E">अङ्ग्रेजी (English)</option>
                        <option value="N">नेपाली (Nepali)</option>
                        <option value="LC">स्थानीय पाठ्यक्रम (Local Curriculum)</option>
                    </select>
                </div>
            </div>

            <!-- ड्रपडाउन ३: थिम (1-30) -->
            <div class="field-group">
                <label for="themeSelect">३. पाठ / थिम छान्नुहोस् (Theme 1–30)</label>
                <div class="select-wrapper">
                    <select id="themeSelect"></select>
                </div>
            </div>

            <!-- ड्रपडाउन ४: सिकाइ उपलब्धि (1-30) -->
            <div class="field-group">
                <label for="laSelect">४. सिकाइ उपलब्धि (Learning Achievement 1–30)</label>
                <div class="select-wrapper">
                    <select id="laSelect"></select>
                </div>
            </div>
        </div>

        <!-- लाइभ छनोट र स्थिति बक्स -->
        <div class="selection-summary">
            <div class="summary-details" id="summaryText">
                कक्षा १ • गणित • थिम १ • सिकाइ उपलब्धि १
            </div>
            <div class="status-tag ready" id="availabilityBadge">
                ✅ उपलब्ध छ (1MLA1.html)
            </div>
        </div>

        <!-- अर्को बटन -->
        <div class="action-row">
            <button type="button" class="btn-next" id="nextBtn">
                <span>अगाडि बढ्नुहोस् (Next) ➡️</span>
            </button>
        </div>
    </main>
</div>

<!-- "Coming Soon" मोडल -->
<div class="modal-backdrop" id="comingSoonModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
        <div class="modal-icon">🚧📚</div>
        <h2 id="modalTitle">छिट्टै आउँदैछ! (Coming Soon)</h2>
        <p id="modalMessage">
            यो कक्षा र सिकाइ उपलब्धिसँग सम्बन्धित सामाग्री हाल अपलोड गरिएको छैन।
        </p>
        <div class="modal-file-badge" id="modalMissingFile">1MLA3.html</div>
        <button type="button" class="btn-modal-next" id="modalCloseBtn">
            अर्को छान्नुहोस् (Back) ➡️
        </button>
    </div>
</div>

<script>
    // अपलोड गरिएका फाइलहरूको रेजिस्ट्री
    const UPLOADED_FILES = new Set([
        '1MLA1.html',
        '1MLA2.html'
    ]);

    const SUBJECT_NAMES = {
        M: 'गणित (Mathematics)',
        S: 'मेरो सेरोफेरो (Serophero)',
        E: 'अङ्ग्रेजी (English)',
        N: 'नेपाली (Nepali)',
        LC: 'स्थानीय पाठ्यक्रम (Local Curriculum)'
    };

    const gradeSelect = document.getElementById('gradeSelect');
    const subjectSelect = document.getElementById('subjectSelect');
    const themeSelect = document.getElementById('themeSelect');
    const laSelect = document.getElementById('laSelect');
    const fileCodeBadge = document.getElementById('fileCodeBadge');
    const summaryText = document.getElementById('summaryText');
    const availabilityBadge = document.getElementById('availabilityBadge');
    const nextBtn = document.getElementById('nextBtn');

    const comingSoonModal = document.getElementById('comingSoonModal');
    const modalMessage = document.getElementById('modalMessage');
    const modalMissingFile = document.getElementById('modalMissingFile');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    // थिम र सिकाइ उपलब्धिका लागि १ देखि ३० सम्मका विकल्पहरू भर्ने
    function populateRangeDropdown(selectEl, prefix) {
        for (let i = 1; i <= 30; i++) {
            const option = document.createElement('option');
            option.value = String(i);
            option.textContent = `${prefix} ${i}`;
            selectEl.appendChild(option);
        }
    }

    populateRangeDropdown(themeSelect, 'थिम (Theme)');
    populateRangeDropdown(laSelect, 'सिकाइ उपलब्धि (LA)');

    // फाइल नाम निर्माण गर्ने नियम: [Grade][Subject Code]LA[Learning Achievement].html
    function getTargetFileName() {
        const grade = gradeSelect.value;
        const subjectCode = subjectSelect.value;
        const la = laSelect.value;
        return `${grade}${subjectCode}LA${la}.html`;
    }

    // छनोट परिवर्तन हुँदा युआई अपडेट गर्ने
    function updateSelectionState() {
        const grade = gradeSelect.value;
        const subjectCode = subjectSelect.value;
        const subjectName = SUBJECT_NAMES[subjectCode];
        const theme = themeSelect.value;
        const la = laSelect.value;
        const fileName = getTargetFileName();

        fileCodeBadge.textContent = fileName;
        summaryText.textContent = `कक्षा ${grade} • ${subjectName} • थिम ${theme} • सिकाइ उपलब्धि ${la}`;

        if (UPLOADED_FILES.has(fileName)) {
            availabilityBadge.className = 'status-tag ready';
            availabilityBadge.textContent = `✅ उपलब्ध छ (${fileName})`;
        } else {
            availabilityBadge.className = 'status-tag pending';
            availabilityBadge.textContent = `⏳ छिट्टै आउँदैछ`;
        }
    }

    // नेक्स्ट बटन क्लिक गर्दाको लजिक
    async function handleNextClick() {
        const grade = gradeSelect.value;
        const subjectName = SUBJECT_NAMES[subjectSelect.value];
        const theme = themeSelect.value;
        const la = laSelect.value;
        const targetFile = getTargetFileName();

        if (UPLOADED_FILES.has(targetFile)) {
            window.location.href = targetFile;
            return;
        }

        if (window.location.protocol.startsWith('http')) {
            try {
                const response = await fetch(targetFile, { method: 'HEAD' });
                if (response.ok) {
                    window.location.href = targetFile;
                    return;
                }
            } catch (err) {}
        }

        modalMessage.innerHTML = `
            <strong>Coming Soon!</strong><br>
            <strong>कक्षा ${grade} ${subjectName}</strong> (थिम ${theme}, सिकाइ उपलब्धि ${la}) को सामाग्री हाल तयार भइरहेको छ।
        `;
        modalMissingFile.textContent = `File: ${targetFile}`;
        comingSoonModal.classList.add('active');
    }

    // इभेन्ट लिसनरहरू
    [gradeSelect, subjectSelect, themeSelect, laSelect].forEach(el => {
        el.addEventListener('change', updateSelectionState);
    });

    nextBtn.addEventListener('click', handleNextClick);

    modalCloseBtn.addEventListener('click', () => {
        comingSoonModal.classList.remove('active');
    });

    comingSoonModal.addEventListener('click', (e) => {
        if (e.target === comingSoonModal) {
            comingSoonModal.classList.remove('active');
        }
    });

    // सुरुवाती लोड
    updateSelectionState();
</script>

</body>
</html>
